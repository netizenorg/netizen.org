<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">

      <title>netizen.org</title>
      <meta name="author" content="netizen.org">
    <meta name="description" content="netizen.org propels curious citizens of the ‘net beyond problematic defaults towards a more creative, playful, and equitable digital world. We are a collective of new media artists, educators and activists on a mission to reestablish human agency in the information age through public lectures, workshops, digital tools, online events and festivals.">

      <!-- social media stuff -->
      <meta property="og:title" content="netizen.org">
      <meta property="og:url" content="http://netizen.org">
      <meta property="og:image" content="http://netizen.org/images/ntz-square.jpg">
    <meta property="og:description" content="netizen.org propels curious citizens of the ‘net beyond problematic defaults towards a more creative, playful, and equitable digital world. We are a collective of new media artists, educators and activists on a mission to reestablish human agency in the information age through public lectures, workshops, digital tools, online events and festivals.">
      <meta name="twitter:card" content="summary_large_image">
      <meta property="og:site_name" content="netizen.org">
      <meta name="twitter:site" content="@netizenorg">

      <link rel="icon" href="images/ntz-logo.svg" type="image/svg+xml">
      <link rel="stylesheet" href="css/fonts.css">
      <style media="screen">
        :root {
          --prim-a: #fff;
          --prim-b: #000;
          --out-cubic: cubic-bezier(0.215,0.61,0.355,1);
        }

        body {
          margin: 0;
          background: var(--prim-a);

          overflow-x: hidden;

          font-family: 'Zen Maru Gothic', serif;
          background-color: var(--prim-b);
          color: var(--prim-a);
        }

        #loader {
          position: fixed;
          top: 0px;
          left: 0px;

          display: flex;
          justify-content: center;
          align-items: center;

          width: 100vw;
          height: 100vh;
        }

        #loader > img {
          max-width: 60%;
        }

        @keyframes marquee-scroll {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }

        .marquee-wrapper {
          position: fixed;
          bottom: 0;
          left: 0;
          width: 100%;
          overflow: hidden;
        }

        .message {
          display: flex;
          width: max-content;
          animation: marquee-scroll 30s linear infinite;
        }

        .message span {
          font-size: 3em;
          white-space: nowrap;
          flex-shrink: 0;
          padding-right: 0.5em;
        }
      </style>
    </head>
    <body>

      <section id="loader">
        <img src="images/logo-inverted-animated.svg" alt="netizen.org logo animated for the load screen">
      </section>

      <div class="marquee-wrapper">
        <div class="message">
          <span><b>*.O</b> ◕ ◞ ◕ <a href="https://netnet.studio" target="_blank">netnet.studio</a> just released! <b>*.O</b> hi@netizen.org</span>
          <span><b>*.O</b> <a href="https://www.youtube.com/watch?v=wtsDvFxQx-A" target="_blank"> learn more about netnet</a> <b>*.O</b> hi@netizen.org</span>
          <span><b>*.O</b> more updates soon <b>*.O</b> hi@netizen.org</span>
          <span><b>*.O</b> new website!? == <a href="https://buttondown.com/netizen.org" target="_blank"> a newsletter</a>!? <b>*.O</b> hi@netizen.org</span>
        </div>
      </div>

      <script type="text/javascript">
        const c = ['#ff9999', '#ff99cc', '#ff99ff', '#cc99ff', '#9999ff', '#99ccff', '#99ffff', '#99ffcc', '#99ff99', '#ccff99', '#ffff99', '#ffcc99']

        document.querySelectorAll('.message b').forEach((b,i) => {
          b.style.color = c[i*2 % c.length / 2]
        })
      </script>

    </body>
</html>
